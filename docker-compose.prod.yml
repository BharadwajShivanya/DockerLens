services:
  backend:
    platform: linux/amd64  # Ensures correct architecture for Gunicorn
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: dockerlens-backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DOCKER_MODE=${DOCKER_MODE:-auto}
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dockerlens-frontend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: dockerlens-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

