version: "3.8"

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro  # optional TLS certs
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: dockerlens-backend:prod
    environment:
      - LOG_LEVEL=INFO
      - DOCKER_MODE=${DOCKER_MODE:-auto}   # "auto" or "mock"
    # For local demo only: to let backend access host docker
    # WARNING: mounting host socket gives elevated access — use only for local demos
    volumes:
      - ${DOCKER_SOCKET_BIND:-/var/run/docker.sock:/var/run/docker.sock}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # assume frontend has Dockerfile to build static
    image: dockerlens-frontend:prod
    ports:
      - "3000:3000"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/google-containers/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

